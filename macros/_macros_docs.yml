macros:
  - name: cents_to_dollars
    description: a macro that converts dollars to cents and rounds to the input decimal places, or 2 as default
    arguments:
      - name: column_name
        type: string
        description: the name of the column you want to convert inside quotes
  - name: grant_select
    description: A macro that grants select privs on target.schema and target.role, unless otherwise specified
    arguments:
       - name: schema
         type: string
         description: The schema we want users to access
       - name: role
         description: role we're granted access to 